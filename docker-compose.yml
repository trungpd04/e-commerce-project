services:
  dbservice:
    image: mysql:8.0
    container_name: ecommercedb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommercedb
    volumes:
      - mysql_data:/var/lib/mysql
  dbservice-refactor-category:
    image: mysql:8.0
    container_name: ecommercedb-2
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommercedb
    volumes:
      - mysql_data_refactor_category:/var/lib/mysql

volumes:
  mysql_data:
  mysql_data_refactor_category: